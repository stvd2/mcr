<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإحالات الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3f37c9;
            --danger: #ef233c;
            --success: #4cc9f0;
            --warning: #f8961e;
            --dark: #2b2d42;
            --gray: #adb5bd;
            --light: #f8f9fa;
            --sidebar-bg: #1e1f3d;
            --border-radius: 0.5rem;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
            --light-gray: #f5f5f5;
            --border-gray: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            direction: rtl;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        /* أنماط تسجيل الدخول */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fb 0%, #e4e8f5 100%);
        }

        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        .auth-header {
            padding: 30px;
            text-align: center;
            background: linear-gradient(to right, #4361ee, #4895ef);
            color: white;
            border-radius: 15px 15px 0 0;
        }

        .auth-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
            outline: none;
        }

        .toggle-password {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gray);
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .error-message {
            color: var(--danger);
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        /* أنماط لوحة التحكم */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--sidebar-bg);
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 0 20px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav {
            flex: 1;
            padding: 0 10px;
        }

        .nav-item {
            margin-bottom: 5px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-item a:hover,
        .nav-item.active a {
            background: var(--primary);
            color: white;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: var(--transition);
        }

        .logout-btn:hover {
            color: white;
        }

        .main-content {
            padding: 30px;
            background-color: #f5f7fa;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: white;
        }

        /* Horizontal Layout Styles */
        .horizontal-layout .form-sections-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: stretch;
        }
        
        .horizontal-layout .form-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .horizontal-layout .form-section {
            background: var(--light-gray);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--box-shadow);
            flex: 1;
            border: 1px solid var(--border-gray);
        }
        
        .horizontal-layout .referral-info {
            flex: 1.5;
        }
        
        .horizontal-layout .section-title {
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-gray);
            font-size: 16px;
        }
        
        .horizontal-layout .form-group {
            margin-bottom: 15px;
        }
        
        .horizontal-layout label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .horizontal-layout input,
        .horizontal-layout select,
        .horizontal-layout textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-gray);
            border-radius: 4px;
            background: white;
        }
        
        .horizontal-layout .required-field::after {
            content: " *";
            color: var(--danger);
        }
        
        .horizontal-layout .form-actions {
            text-align: center;
            margin-top: 20px;
        }
        
        .doctor-notes-input {
            background-color: white;
            border: 1px solid var(--border-gray) !important;
            color: #333;
            min-height: 150px;
        }
        
        .doctor-notes-input::placeholder {
            color: #666;
        }

        /* أنماط التنبيهات والتحميل */
        .alert-container {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 9999;
            pointer-events: none;
        }

        .alert {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            animation: slideIn 0.3s ease-out;
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        .alert-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-icon {
            font-size: 20px;
        }

        .alert-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-right: auto;
            padding: 0 0 0 10px;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9998;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9997;
        }

        .confirm-content {
            background: white;
            padding: 25px;
            border-radius: var(--border-radius);
            max-width: 500px;
            width: 90%;
            box-shadow: var(--box-shadow);
            text-align: center;
        }

        .confirm-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-confirm {
            background: var(--danger);
            color: white;
        }

        .btn-cancel {
            background: var(--gray);
            color: white;
        }

        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* أنماط إضافية للوحة التحكم */
        .dashboard-overview {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--box-shadow);
            border-left: 4px solid var(--primary);
        }

        .stat-card.primary {
            border-left-color: var(--primary);
        }

        .stat-card.success {
            border-left-color: var(--success);
        }

        .stat-card.warning {
            border-left-color: var(--warning);
        }

        .stat-icon {
            font-size: 2rem;
            color: var(--primary);
        }

        .stat-card.success .stat-icon {
            color: var(--success);
        }

        .stat-card.warning .stat-icon {
            color: var(--warning);
        }

        .stat-info h3 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .recent-referrals {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--box-shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .view-all {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .referrals-table-container {
            overflow-x: auto;
        }

        .referrals-table {
            width: 100%;
            border-collapse: collapse;
        }

        .referrals-table th,
        .referrals-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        .referrals-table th {
            background-color: #f5f7fa;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1rem;
            margin: 0 5px;
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--box-shadow);
        }

        .chart-card h4 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-card canvas {
            width: 100% !important;
            height: 300px !important;
        }

        /* أنماط الإحالات الطارئة */
        .emergency-referrals {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
        }

        .emergency-referrals h3 {
            color: var(--danger);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .emergency-card {
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .emergency-card.life-saving {
            background: linear-gradient(to right, #ef233c, #d90429);
        }

        .emergency-card.emergency {
            background: linear-gradient(to right, #f8961e, #f3722c);
        }

        .emergency-card.admission {
            background: linear-gradient(to right, #2a9d8f, #4cc9f0);
        }

        .emergency-info {
            flex: 1;
        }

        .emergency-actions {
            display: flex;
            gap: 10px;
        }

        .emergency-badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* أنماط قسم المرفقات */
        .form-section.attachments {
            margin-top: 20px;
        }

        .attachments-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .attachment-item {
            background: #f5f7fa;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: calc(50% - 5px);
            position: relative;
        }

        .attachment-icon {
            font-size: 20px;
            color: #4361ee;
        }

        .attachment-info {
            flex: 1;
            overflow: hidden;
        }

        .attachment-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .attachment-size {
            font-size: 12px;
            color: #6c757d;
        }

        .attachment-actions {
            display: flex;
            gap: 5px;
        }

        .attachment-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #4361ee;
            font-size: 14px;
        }

        .attachment-btn.delete {
            color: #ef233c;
        }

        .attachment-preview-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .attachment-preview-content {
            background: white;
            border-radius: 8px;
            max-width: 90%;
            max-height: 90%;
            padding: 20px;
            position: relative;
        }

        .close-preview {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ef233c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        .preview-image {
            max-width: 100%;
            max-height: 80vh;
            display: block;
        }

        .preview-other {
            padding: 20px;
            text-align: center;
        }

        /* أنماط modal الإحالات الشهرية */
        .custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            color: var(--primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-gray);
            text-align: center;
        }

        .referrals-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--light-gray);
            border-radius: var(--border-radius);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .referrals-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .referral-item {
            background: white;
            border-radius: var(--border-radius);
            padding: 15px;
            box-shadow: var(--box-shadow);
            border-left: 4px solid var(--primary);
        }

        .referral-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .referral-details {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .referral-details p {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .referral-actions {
            text-align: left;
        }

        .no-referrals {
            text-align: center;
            padding: 30px;
            color: var(--gray);
        }

        .no-referrals i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--gray);
        }
    </style>
</head>
<body>
    <!-- صفحة تسجيل الدخول -->
    <div id="login-page" class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-hospital-alt" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <h1>نظام الإحالات الطبية</h1>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> اسم المستخدم</label>
                    <input type="text" id="username" class="form-control" autocomplete="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> كلمة المرور</label>
                    <input type="password" id="password" class="form-control" autocomplete="current-password" placeholder="أدخل كلمة المرور" required>
                    <i id="toggle-password" class="fas fa-eye-slash toggle-password"></i>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> دخول</button>
                </div>
                <div class="forgot-password">
                    <a href="#" id="forgot-password">نسيت كلمة المرور؟</a>
                </div>
                <div id="error-message" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard-page" class="dashboard-layout hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-clipboard-list" style="font-size: 1.5rem;"></i>
                <h2>نظام الإحالات</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active" data-page="dashboard">
                        <a href="#"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
                    </li>
                    <li class="nav-item" data-page="referrals">
                        <a href="#"><i class="fas fa-file-medical"></i> إحالة جديدة</a>
                    </li>
                    <li class="nav-item" data-page="referrals-list">
                        <a href="#"><i class="fas fa-list"></i> قائمة الإحالات</a>
                    </li>
                    <li class="nav-item" data-page="reports">
                        <a href="#"><i class="fas fa-chart-bar"></i> التقارير</a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
            </div>
        </aside>
        <main class="main-content">
            <div class="content-header">
                <div>
                    <h1 id="page-title">لوحة التحكم</h1>
                    <p id="page-subtitle">مرحبًا بك في النظام</p>
                </div>
                <div class="user-profile">
                    <div>
                        <span class="user-name">اسم المستخدم</span><br>
                        <span class="user-role">الوظيفة</span>
                    </div>
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>
            <div id="page-content">
                <!-- محتوى الصفحة سيتم تحميله هنا -->
            </div>
        </main>
    </div>

    <!-- المكونات العامة -->
    <div id="alert-container" class="alert-container"></div>
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>

            users: [
                { id: 1, username: "admin", password: "Admin123@", fullName: "مدير النظام", role: "admin" },
                { id: 2, username: "doctor", password: "Doctor123@", fullName: "د. أحمد محمد", role: "doctor" }
            ],

            async login(username, password) {
                const user = this.users.find(u => 
                    u.username === username && u.password === password
                );
                
                if (!user) throw new Error('بيانات الدخول غير صحيحة');
                
                localStorage.setItem('current_user', JSON.stringify(user));
                return user;
            },

            logout() {
                localStorage.removeItem('current_user');
            },

            getCurrentUser() {
                return JSON.parse(localStorage.getItem('current_user'));
            }
        };

        // ========== خدمة الإحالات ==========
        const ReferralService = {
            getReferrals() {
                return JSON.parse(localStorage.getItem('referrals')) || [];
            },

            saveReferrals(referrals) {
                localStorage.setItem('referrals', JSON.stringify(referrals));
            },

            async create(referralData) {
                const referrals = this.getReferrals();
                const newReferral = {
                    id: Date.now(),
                    ...referralData,
                    createdAt: new Date().toISOString(),
                    status: 'pending'
                };
                referrals.push(newReferral);
                this.saveReferrals(referrals);
                return newReferral;
            },

            async getAll() {
                return this.getReferrals();
            },

            async getById(id) {
                return this.getReferrals().find(r => r.id === id);
            },

            async update(id, updates) {
                const referrals = this.getReferrals().map(r => 
                    r.id === id ? {...r, ...updates} : r
                );
                this.saveReferrals(referrals);
                return this.getById(id);
            },

            async delete(id) {
                const referrals = this.getReferrals().filter(r => r.id !== id);
                this.saveReferrals(referrals);
                return true;
            }
        };

        // ========== خدمة الإحصائيات ==========
        const StatsService = {
            async getDashboardStats() {
                const referrals = await ReferralService.getAll();
                return {
                    totalReferrals: referrals.length,
                    completedReferrals: referrals.filter(r => r.status === 'completed').length,
                    pendingReferrals: referrals.filter(r => r.status === 'pending').length
                };
            },

            async getSpecialtyDistribution() {
                const referrals = await ReferralService.getAll();
                const specialties = {};
                
                referrals.forEach(r => {
                    specialties[r.referralSpecialty] = (specialties[r.referralSpecialty] || 0) + 1;
                });
                
                return {
                    labels: Object.keys(specialties),
                    values: Object.values(specialties)
                };
            },

            async getMonthlyReferrals() {
                const referrals = await ReferralService.getAll();
                const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'];
                
                return {
                    labels: months,
                    values: months.map(() => Math.floor(Math.random() * 30) + 10)
                };
            }
        };

        // ========== خدمة التنبيهات ==========
        const AlertService = {
            show(type, message, duration = 5000) {
                const alertContainer = document.getElementById('alert-container');
                const alert = document.createElement('div');
                
                alert.className = `alert alert-${type}`;
                alert.innerHTML = `
                    <div class="alert-content">
                        <i class="alert-icon ${this.getIcon(type)}"></i>
                        <span>${message}</span>
                        <button class="alert-close">&times;</button>
                    </div>
                `;
                
                alertContainer.appendChild(alert);
                
                setTimeout(() => {
                    alert.classList.add('fade-out');
                    setTimeout(() => alert.remove(), 500);
                }, duration);
                
                alert.querySelector('.alert-close').addEventListener('click', () => {
                    alert.remove();
                });
            },

            getIcon(type) {
                const icons = {
                    success: 'fas fa-check-circle',
                    error: 'fas fa-exclamation-circle',
                    warning: 'fas fa-exclamation-triangle',
                    info: 'fas fa-info-circle'
                };
                return icons[type] || icons.info;
            }

        // ========== خدمة التحميل ==========
        const LoadingService = {
            show() {

            hide() {

        };

        // ========== خدمة التأكيد ==========
        const ConfirmService = {
            async show(message) {
                return new Promise((resolve) => {
                    const modal = document.createElement('div');
                    modal.className = 'confirm-modal';
                    modal.innerHTML = `
                        <div class="confirm-content">
                            <p>${message}</p>
                            <div class="confirm-buttons">
                                <button class="btn btn-cancel">إلغاء</button>
                                <button class="btn btn-confirm">تأكيد</button>
                            </div>
                        </div>
                    `;
                    
                    document.body.appendChild(modal);
                    
                    modal.querySelector('.btn-cancel').addEventListener('click', () => {
                        modal.remove();
                        resolve(false);
                    });
                    
                    modal.querySelector('.btn-confirm').addEventListener('click', () => {
                        modal.remove();
                        resolve(true);
                    });
                });
            }
        };

            async initSpecialtyChart(chartId) {
                const data = await StatsService.getSpecialtyDistribution();
                const ctx = document.getElementById(chartId).getContext('2d');
                
                // تدمير المخطط القديم إذا كان موجودًا
                if (this.specialtyChart) {
                    this.specialtyChart.destroy();
                }
                
                this.specialtyChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.values,
                            backgroundColor: [
                                '#4361ee', '#3f37c9', '#4895ef', 
                                '#4cc9f0', '#f72585', '#7209b7',
                                '#b5179e', '#560bad', '#3a0ca3'
                            ],
                            borderWidth: 1,
                            hoverOffset: 15
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'left',
                                rtl: true,
                                onClick: (e, legendItem, legend) => {
                                    const index = legendItem.datasetIndex;
                                    const ci = legend.chart;
                                    ci.getDatasetMeta(index).hidden = 
                                        ci.getDatasetMeta(index).hidden === null ? 
                                        !ci.data.datasets[index].hidden : null;
                                    ci.update();
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const label = context.label || '';
                                        const value = context.raw || 0;
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = Math.round((value / total) * 100);
                                        return `${label}: ${value} (${percentage}%)`;
                                    }
                                }
                            }
                        },
                        animation: {
                            animateScale: true,
                            animateRotate: true
                        }
                    }
                });
            }

            async showMonthlyReferrals(monthName) {
                try {
                    LoadingService.show();
                    const referrals = await ReferralService.getAll();
                    
                    const monthReferrals = referrals.filter(ref => {
                        const refDate = new Date(ref.createdAt);
                        const refMonth = refDate.toLocaleString('ar-EG', { month: 'long' });
                        return refMonth === monthName;
                    }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    
                    // تنسيق محتوى الإحالات
                    const content = monthReferrals.length > 0 ? 
                        `<div class="monthly-referrals-container">
                            <div class="referrals-stats">
                                <span class="stat-item"><i class="fas fa-file-medical"></i> الإجمالي: ${monthReferrals.length}</span>
                                <span class="stat-item"><i class="fas fa-check-circle"></i> المكتملة: ${monthReferrals.filter(r => r.status === 'completed').length}</span>
                                <span class="stat-item"><i class="fas fa-clock"></i> قيد الانتظار: ${monthReferrals.filter(r => r.status === 'pending').length}</span>
                            </div>
                            <div class="referrals-list">
                                ${monthReferrals.map(ref => `
                                    <div class="referral-item" data-id="${ref.id}">
                                        <div class="referral-header">
                                            <h4>${ref.patientName}</h4>
                                            <span class="status-badge status-${ref.status}">${this.getStatusText(ref.status)}</span>
                                        </div>
                                        <div class="referral-details">
                                            <p><i class="fas fa-stethoscope"></i> ${ref.referralSpecialty}</p>
                                            <p><i class="fas fa-calendar-alt"></i> ${new Date(ref.createdAt).toLocaleString('ar-EG')}</p>
                                        </div>
                                        <div class="referral-actions">
                                            <button class="action-btn view-btn" data-id="${ref.id}">
                                                <i class="fas fa-eye"></i> عرض
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>` : 
                        `<div class="no-referrals">
                            <i class="fas fa-calendar-times"></i>
                            <p>لا توجد إحالات مسجلة لشهر ${monthName}</p>
                        </div>`;
                    
                    // إنشاء modal مخصص
                    const modal = document.createElement('div');
                    modal.className = 'custom-modal';
                    modal.innerHTML = `
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3><i class="fas fa-calendar-alt"></i> إحالات شهر ${monthName}</h3>
                                <button class="modal-close">&times;</button>
                            </div>
                            <div class="modal-body">
                                ${content}
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-primary export-btn">
                                    <i class="fas fa-file-export"></i> تصدير البيانات
                                </button>
                            </div>
                        </div>
                    `;
                    
                    document.body.appendChild(modal);
                    
                    // إضافة أحداث لأزرار الإغلاق والعرض
                    modal.querySelector('.modal-close').addEventListener('click', () => {
                        modal.remove();
                    });
                    
                    modal.querySelectorAll('.view-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const id = btn.dataset.id;
                            this.viewReferral(id);
                            modal.remove();
                        });
                    });
                    
                    modal.querySelector('.export-btn').addEventListener('click', () => {
                        this.exportMonthlyData(monthName, monthReferrals);
                    });
                    
                    // إغلاق النافذة عند النقر خارجها
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) {
                            modal.remove();
                        }
                    });
                    
                } catch (error) {
                    AlertService.show('error', 'حدث خطأ أثناء تحميل إحالات الشهر');
                    console.error(error);
                } finally {
                    LoadingService.hide();
                }
            }

            exportMonthlyData(monthName, referrals) {
                const dataStr = JSON.stringify(referrals, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const exportFileDefaultName = `إحالات_${monthName}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                AlertService.show('success', `تم تصدير بيانات شهر ${monthName}`);
            }

            initReferralForm() {
                const form = document.getElementById('referral-form');
                if (!form) return;
                
                const referralId = new URLSearchParams(window.location.search).get('id');
                const isEditMode = !!referralId;
                
                // تهيئة إدارة المرفقات
                const fileUpload = document.getElementById('file-upload');
                const attachmentsPreview = document.getElementById('attachments-preview');
                const previewContainer = document.getElementById('attachment-preview-container');
                const previewContent = document.getElementById('preview-content');
                
                // عند اختيار ملفات جديدة
                fileUpload.addEventListener('change', function(e) {
                    const files = Array.from(e.target.files);
                    attachments = [...attachments, ...files];
                    renderAttachments();
                });
                
                // عرض المرفقات
                const renderAttachments = () => {
                    attachmentsPreview.innerHTML = '';
                    
                    attachments.forEach((file, index) => {
                        const fileType = file.type.split('/')[0];
                        const fileIcon = getFileIcon(fileType, file.name);
                        const fileSize = formatFileSize(file.size);
                        
                        const attachmentItem = document.createElement('div');
                        attachmentItem.className = 'attachment-item';
                        attachmentItem.innerHTML = `
                            <div class="attachment-icon">
                                <i class="fas ${fileIcon}"></i>
                            </div>
                            <div class="attachment-info">
                                <div class="attachment-name" title="${file.name}">${file.name}</div>
                                <div class="attachment-size">${fileSize}</div>
                            </div>
                            <div class="attachment-actions">
                                <button class="attachment-btn view" data-index="${index}">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="attachment-btn delete" data-index="${index}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                        
                        attachmentsPreview.appendChild(attachmentItem);
                    });
                    
                    // إضافة أحداث للأزرار
                    document.querySelectorAll('.attachment-btn.view').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const index = e.currentTarget.dataset.index;
                            previewAttachment(attachments[index]);
                        });
                    });
                    
                    document.querySelectorAll('.attachment-btn.delete').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const index = e.currentTarget.dataset.index;
                            attachments.splice(index, 1);
                            renderAttachments();
                        });
                    });
                };
                
                // معاينة المرفق
                const previewAttachment = (file) => {
                    const fileType = file.type.split('/')[0];
                    previewContent.innerHTML = '';
                    
                    if (fileType === 'image') {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            previewContent.innerHTML = `<img src="${e.target.result}" class="preview-image">`;
                        };
                        reader.readAsDataURL(file);
                    } else if (fileType === 'application' && file.name.endsWith('.pdf')) {
                        previewContent.innerHTML = `
                            <div class="preview-other">
                                <i class="fas fa-file-pdf" style="font-size: 50px; color: #e63946; margin-bottom: 20px;"></i>
                                <h4>${file.name}</h4>
                                <p>لا يمكن معاينة ملفات PDF مباشرة، يرجى تنزيل الملف</p>
                                <button class="btn btn-primary download-btn" style="margin-top: 20px;">
                                    <i class="fas fa-download"></i> تنزيل الملف
                                </button>
                            </div>
                        `;
                        
                        document.querySelector('.download-btn').addEventListener('click', () => {
                            downloadFile(file);
                        });
                    } else {
                        previewContent.innerHTML = `
                            <div class="preview-other">
                                <i class="fas fa-file" style="font-size: 50px; color: #4361ee; margin-bottom: 20px;"></i>
                                <h4>${file.name}</h4>
                                <p>لا يمكن معاينة هذا النوع من الملفات</p>
                                <button class="btn btn-primary download-btn" style="margin-top: 20px;">
                                    <i class="fas fa-download"></i> تنزيل الملف
                                </button>
                            </div>
                        `;
                        
                        document.querySelector('.download-btn').addEventListener('click', () => {
                            downloadFile(file);
                        });
                    }
                    
                    previewContainer.style.display = 'flex';
                };
                
                // إغلاق معاينة المرفق
                document.querySelector('.close-preview').addEventListener('click', () => {
                    previewContainer.style.display = 'none';
                });
                
                // دوال مساعدة
                const getFileIcon = (type, fileName) => {
                    if (type === 'image') return 'fa-image';
                    if (type === 'video') return 'fa-video';
                    if (type === 'audio') return 'fa-music';
                    if (fileName.endsWith('.pdf')) return 'fa-file-pdf';
                    if (fileName.endsWith('.doc') || fileName.endsWith('.docx')) return 'fa-file-word';
                    if (fileName.endsWith('.xls') || fileName.endsWith('.xlsx')) return 'fa-file-excel';
                    return 'fa-file';
                };
                
                const formatFileSize = (bytes) => {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
                };
                
                const downloadFile = (file) => {
                    const url = URL.createObjectURL(file);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };
                
                if (isEditMode) {
                    this.loadReferralData(referralId);
                }
                
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    try {
                        LoadingService.show();
                        
                        const referralData = {
                            patientName: document.getElementById('patient-name').value,
                            patientNationality: document.getElementById('patient-nationality').value,
                            patientGender: document.getElementById('patient-gender').value,
                            patientType: document.getElementById('patient-type').value,
                            fileNumber: document.getElementById('file-number').value,
                            roomNumber: document.getElementById('room-number').value,
                            referralType: document.getElementById('referral-type').value,
                            referralSpecialty: document.getElementById('referral-specialty').value,
                            doctorName: document.getElementById('doctor-name').value,
                            doctorPhone: document.getElementById('doctor-phone').value,
                            doctorNotes: document.getElementById('doctor-notes').value,
                            attachments: attachments.map(file => ({
                                name: file.name,
                                size: file.size,
                                type: file.type
                            }))
                        };
                        
                        if (isEditMode) {
                            await ReferralService.update(parseInt(referralId), referralData);
                            AlertService.show('success', 'تم تحديث الإحالة بنجاح');
                        } else {
                            await ReferralService.create(referralData);
                            AlertService.show('success', 'تم إنشاء الإحالة بنجاح');
                            form.reset();
                            attachments = [];
                            renderAttachments();
                        }
                    } catch (error) {
                        AlertService.show('error', 'حدث خطأ أثناء حفظ الإحالة');
                        console.error(error);
                    } finally {
                        LoadingService.hide();
                    }
                });
            }

            async loadReferralData(id) {
                try {
                    LoadingService.show();
                    const referral = await ReferralService.getById(parseInt(id));
                    
                    if (!referral) {
                        AlertService.show('error', 'الإحالة غير موجودة');
                        return;
                    }
                    
                    document.getElementById('patient-name').value = referral.patientName;
                    document.getElementById('patient-nationality').value = referral.patientNationality;
                    document.getElementById('patient-gender').value = referral.patientGender;
                    document.getElementById('patient-type').value = referral.patientType;
                    document.getElementById('file-number').value = referral.fileNumber;
                    document.getElementById('room-number').value = referral.roomNumber;
                    document.getElementById('referral-type').value = referral.referralType;
                    document.getElementById('referral-specialty').value = referral.referralSpecialty;
                    document.getElementById('doctor-name').value = referral.doctorName;
                    document.getElementById('doctor-phone').value = referral.doctorPhone;
                    document.getElementById('doctor-notes').value = referral.doctorNotes;
                    
                    // تحميل المرفقات إذا وجدت
                    if (referral.attachments && referral.attachments.length > 0) {
                        attachments = referral.attachments;
                        
                        // عرض المرفقات
                        const attachmentsPreview = document.getElementById('attachments-preview');
                        attachmentsPreview.innerHTML = '';
                        
                        referral.attachments.forEach((file, index) => {
                            const fileIcon = this.getFileIcon(file.type, file.name);
                            const fileSize = this.formatFileSize(file.size);
                            
                            const attachmentItem = document.createElement('div');
                            attachmentItem.className = 'attachment-item';
                            attachmentItem.innerHTML = `
                                <div class="attachment-icon">
                                    <i class="fas ${fileIcon}"></i>
                                </div>
                                <div class="attachment-info">
                                    <div class="attachment-name" title="${file.name}">${file.name}</div>
                                    <div class="attachment-size">${fileSize}</div>
                                </div>
                                <div class="attachment-actions">
                                    <button class="attachment-btn view" data-index="${index}">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            `;
                            
                            attachmentsPreview.appendChild(attachmentItem);
                            
                            // إضافة حدث لعرض المرفق
                            attachmentItem.querySelector('.attachment-btn.view').addEventListener('click', () => {
                                AlertService.show('info', `عرض المرفق: ${file.name}`);
                            });
                        });
                    }
                    
                } catch (error) {
                    AlertService.show('error', 'حدث خطأ أثناء تحميل بيانات الإحالة');
                    console.error(error);
                } finally {
                    LoadingService.hide();
                }
            }

            getFileIcon(fileType, fileName) {
                const type = fileType?.split('/')[0] || '';
                if (type === 'image') return 'fa-image';
                if (type === 'video') return 'fa-video';
                if (type === 'audio') return 'fa-music';
                if (fileName?.endsWith('.pdf')) return 'fa-file-pdf';
                if (fileName?.endsWith('.doc') || fileName?.endsWith('.docx')) return 'fa-file-word';
                if (fileName?.endsWith('.xls') || fileName?.endsWith('.xlsx')) return 'fa-file-excel';
                return 'fa-file';
            }

            formatFileSize(bytes) {
                if (!bytes) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }

                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        this.editReferral(id);

                });
                
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        this.deleteReferral(id);

                });

                currentPage = 'referrals';
                window.location.hash = `#referrals?id=${id}`;
                this.loadPageContent();
            }

                    LoadingService.show();

                    AlertService.show('error', 'حدث خطأ أثناء حذف الإحالة');
                    console.error(error);
                } finally {
                    LoadingService.hide();

            const loginForm = document.getElementById('login-form');

                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    
                    try {
                        LoadingService.show();
                        const user = await AuthService.login(username, password);
                        
                        document.getElementById('login-page').classList.add('hidden');
                        document.getElementById('dashboard-page').classList.remove('hidden');
                        
                        currentUser = user;
                        new Dashboard();

                        document.getElementById('error-message').textContent = error.message;
                    } finally {
                        LoadingService.hide();
                    }
                });
                
                // تبديل عرض كلمة المرور
                document.getElementById('toggle-password').addEventListener('click', function() {
                    const passwordInput = document.getElementById('password');
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);

                    this.classList.toggle('fa-eye');

            }
            
            // تهيئة لوحة التحكم إذا كان المستخدم مسجل الدخول
            if (AuthService.getCurrentUser()) {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('dashboard-page').classList.remove('hidden');
                new Dashboard();
            }
            
            // تسجيل الخروج
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    AuthService.logout();
                    window.location.reload();
                });
            }
        });
    </script>
</body>
</html>
